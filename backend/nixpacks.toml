providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  "python -c \"import email_validator, multipart, fastapi, uvicorn, passlib, bcrypt; print('deps-ok')\""
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
